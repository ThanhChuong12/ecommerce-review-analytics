name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Frontend Validation Job
  frontend-check:
    name: Frontend Lint Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'web_platform/frontend/package-lock.json'

    - name: Install dependencies (Frontend)
      run: |
        cd web_platform/frontend
        npm ci

    - name: Run Linter
      run: |
        cd web_platform/frontend
        npm run lint
      continue-on-error: true # Allow non-blocking lint warnings during initial CI setup

  # 2. Backend Validation Job
  backend-check:
    name: Backend Dependency & Syntax Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'web_platform/backend/package-lock.json'

    - name: Install dependencies (Backend)
      run: |
        cd web_platform/backend
        npm ci

  # 3. AI Engine Test & Validation Job
  python-ai-tests:
    name: Python AI Engine & Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'ai_engine/requirements.txt'

    - name: Install dependencies
      run: |
        cd ai_engine
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run Unit Tests with pytest
      run: |
        python -m pytest tests/ -v